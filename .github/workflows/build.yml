name: Build O3M Desktop

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_name: windows-build
            build_path: build/windows/x64/runner/Release/*

          - os: macos-latest
            target: macos
            artifact_name: macos-build
            build_path: build/macos/Build/Products/Release/*.app

          - os: ubuntu-latest
            target: linux
            artifact_name: linux-build
            build_path: build/linux/x64/release/bundle

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
  
      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Flutter Desktop App
        run: flutter build ${{ matrix.target }} --release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.build_path }}